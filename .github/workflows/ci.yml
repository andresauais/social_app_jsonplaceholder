name: CI

on:
  push:
    branches:
      - main
  # Solo ejecutará cuando haya un push en main
  # Idealmente tras un merge desde develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run unit and integration tests
        run: npm run test

      - name: Build project (tsc + vite)
        run: npm run build
